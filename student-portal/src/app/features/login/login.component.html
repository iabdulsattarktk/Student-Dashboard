<div class="login-page">
  <div class="login-box">
    <h2>Student Portal</h2>
    <p class="subtitle">Sign in to continue</p>

    <form (ngSubmit)="onSubmit()">
      <div class="field">
        <label>Username</label>
        <input type="text" [(ngModel)]="username" name="username" placeholder="Enter username">
      </div>

      <div class="field">
        <label>Password</label>
        <input type="password" [(ngModel)]="password" name="password" placeholder="Enter password">
      </div>

      <p class="error-msg" *ngIf="errorMsg">{{ errorMsg }}</p>

      <button type="submit">Login</button>
    </form>

    <p class="hint">Demo: username = <b>student</b>, password = <b>1234</b></p>
  </div>
</div>
